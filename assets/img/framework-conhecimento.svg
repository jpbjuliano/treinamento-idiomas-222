<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1900" viewBox="0 0 1400 1900" role="img" aria-labelledby="title desc">
  <title id="title">Framework do Conhecimento — Como a trilha 222 deve funcionar</title>
  <desc id="desc">Infográfico em tons de azul mostrando a trilha Base B1, Alvo N2 e Desafio B2-C1, o ciclo de aprendizagem, habilidades e regra pedagógica.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#081321"/>
      <stop offset="100%" stop-color="#06101d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#3ca6ff"/>
      <stop offset="100%" stop-color="#6be3ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title{font:700 58px Inter,Arial,sans-serif;fill:#eef6ff}.subtitle{font:700 28px Inter,Arial,sans-serif;fill:#b7d5ff}.smallcaps{font:700 17px Inter,Arial,sans-serif;letter-spacing:6px;fill:#6eb8ff}.section{fill:#0b1829;stroke:#1e4a77;stroke-width:2}.panel{fill:#0d1d30;stroke:#245988;stroke-width:2}.panelStrong{fill:#10263d;stroke:url(#accent);stroke-width:3}.label{font:700 18px Inter,Arial,sans-serif;fill:#6ccaff}.h2{font:700 27px Inter,Arial,sans-serif;fill:#f1f8ff}.h3{font:700 22px Inter,Arial,sans-serif;fill:#eef6ff}.body{font:400 19px Inter,Arial,sans-serif;fill:#d7e7fb}.body2{font:400 17px Inter,Arial,sans-serif;fill:#c5d7ee}.note{font:400 16px Inter,Arial,sans-serif;fill:#86a8cc}.chip{fill:#11263d;stroke:#2b5c8f;stroke-width:2}.chipText{font:600 16px Inter,Arial,sans-serif;fill:#dbeafe}.badge{fill:url(#accent)}.badgeText{font:700 15px Inter,Arial,sans-serif;fill:#06203a}.arrow{font:700 70px Inter,Arial,sans-serif;fill:#39b1ff}.stepnum{font:700 18px Inter,Arial,sans-serif;fill:#0c1b2d}.steptext{font:700 18px Inter,Arial,sans-serif;fill:#eef6ff}
    </style>
  </defs>
  <rect width="1400" height="1900" fill="url(#bg)" rx="26"/>
  <text x="55" y="95" class="title">Framework do Conhecimento</text>
  <text x="55" y="140" class="subtitle">Como a trilha 222 deve funcionar</text>
  <text x="57" y="185" class="smallcaps">PRATICAR • EVOLUIR • CONQUISTAR</text>
  <rect x="35" y="225" width="1330" height="360" rx="24" class="section"/>
  <text x="65" y="275" class="label">1. TRILHA DE EVOLUÇÃO</text>
  <text x="65" y="315" class="h2">Três etapas, um objetivo: fluência com consistência.</text>
  <rect x="60" y="350" width="380" height="205" rx="22" class="panel"/>
  <text x="90" y="390" class="h3">01 • Base B1</text><text x="90" y="420" class="label">Consolidar o explícito</text>
  <text x="90" y="455" class="body2">• datas, horários, locais e sequência</text><text x="90" y="485" class="body2">• ideia principal e informação específica</text><text x="90" y="515" class="body2">• vocabulário funcional e rotina</text><text x="90" y="545" class="body2">• mensagens, avisos e diálogos curtos</text>
  <text x="478" y="468" class="arrow">→</text>
  <rect x="510" y="340" width="380" height="225" rx="24" class="panelStrong" filter="url(#glow)"/><rect x="650" y="358" width="180" height="30" rx="15" class="badge"/><text x="685" y="378" class="badgeText">ROTA PRINCIPAL</text>
  <text x="540" y="400" class="h3">02 • Alvo N2</text><text x="540" y="430" class="label">Integrar e interpretar</text><text x="540" y="465" class="body2">• ideia principal + detalhes relevantes</text><text x="540" y="495" class="body2">• causa, consequência, contraste e finalidade</text><text x="540" y="525" class="body2">• sequência, mudança de plano e inferência</text><text x="540" y="555" class="body2">• produção escrita organizada e funcional</text>
  <text x="930" y="468" class="arrow">→</text>
  <rect x="960" y="350" width="380" height="205" rx="22" class="panel"/><text x="990" y="390" class="h3">03 • Desafio B2–C1</text><text x="990" y="420" class="label">Aumentar a margem de segurança</text><text x="990" y="455" class="body2">• atitude, intenção e opinião implícita</text><text x="990" y="485" class="body2">• paráfrase e coesão</text><text x="990" y="515" class="body2">• inferência mais fina</text><text x="990" y="545" class="body2">• maior densidade lexical e velocidade</text>
  <rect x="35" y="615" width="1330" height="290" rx="24" class="section"/><text x="65" y="665" class="label">2. CICLO DE APRENDIZAGEM</text><text x="65" y="705" class="h2">O resultado alimenta a próxima sessão.</text>
  <g><rect x="70" y="745" width="220" height="110" rx="20" class="panel"/><circle cx="110" cy="800" r="22" fill="url(#accent)"/><text x="104" y="807" class="stepnum">1</text><text x="145" y="790" class="steptext">Escolher trilha</text><text x="145" y="820" class="note">Defina seu foco de estudo.</text></g><text x="308" y="809" class="arrow" style="font-size:46px">→</text>
  <g><rect x="355" y="745" width="220" height="110" rx="20" class="panel"/><circle cx="395" cy="800" r="22" fill="url(#accent)"/><text x="389" y="807" class="stepnum">2</text><text x="430" y="790" class="steptext">Praticar CA • CL • EE</text><text x="430" y="820" class="note">Resolva exercícios de forma ativa.</text></g><text x="593" y="809" class="arrow" style="font-size:46px">→</text>
  <g><rect x="640" y="745" width="220" height="110" rx="20" class="panel"/><circle cx="680" cy="800" r="22" fill="url(#accent)"/><text x="674" y="807" class="stepnum">3</text><text x="715" y="790" class="steptext">Corrigir</text><text x="715" y="820" class="note">Analise respostas e evidências.</text></g><text x="878" y="809" class="arrow" style="font-size:46px">→</text>
  <g><rect x="925" y="745" width="190" height="110" rx="20" class="panel"/><circle cx="965" cy="800" r="22" fill="url(#accent)"/><text x="959" y="807" class="stepnum">4</text><text x="1000" y="790" class="steptext">Diagnosticar</text><text x="1000" y="820" class="note">Veja os descritores.</text></g><text x="1131" y="809" class="arrow" style="font-size:46px">→</text>
  <g><rect x="1175" y="745" width="160" height="110" rx="20" class="panel"/><circle cx="1215" cy="800" r="22" fill="url(#accent)"/><text x="1209" y="807" class="stepnum">5</text><text x="1248" y="790" class="steptext">Reforçar</text><text x="1248" y="820" class="note">ou avançar.</text></g>
  <rect x="415" y="867" width="560" height="24" rx="12" fill="#0f2033" stroke="#2c6897" stroke-width="2"/><text x="458" y="884" class="note" style="fill:#8dd6ff;font-weight:700;letter-spacing:2px">APRENDER • AJUSTAR • EVOLUIR • REPETIR</text>
  <rect x="35" y="935" width="1330" height="285" rx="24" class="section"/><text x="65" y="985" class="label">3. HABILIDADES NO DETALHE</text><text x="65" y="1025" class="h2">Quatro frentes que se complementam.</text>
  <g><rect x="60" y="1060" width="300" height="130" rx="18" class="panel"/><text x="85" y="1100" class="h3">CA — ouvir para decidir</text><text x="85" y="1135" class="body2">Captar sentido geral, localizar informação,</text><text x="85" y="1160" class="body2">perceber contraste, intenção e consequência.</text></g>
  <g><rect x="385" y="1060" width="300" height="130" rx="18" class="panel"/><text x="410" y="1100" class="h3">CL — ler para encontrar evidência</text><text x="410" y="1135" class="body2">Ler a pergunta, localizar o trecho relevante</text><text x="410" y="1160" class="body2">e justificar a resposta com evidência textual.</text></g>
  <g><rect x="710" y="1060" width="300" height="130" rx="18" class="panel"/><text x="735" y="1100" class="h3">EE — organizar para comunicar</text><text x="735" y="1135" class="body2">Planejar, escrever e revisar textos funcionais</text><text x="735" y="1160" class="body2">com começo, desenvolvimento e conclusão.</text></g>
  <g><rect x="1035" y="1060" width="300" height="130" rx="18" class="panel"/><text x="1060" y="1100" class="h3">Diagnóstico — estudar o erro</text><text x="1060" y="1135" class="body2">O percentual geral mostra desempenho;</text><text x="1060" y="1160" class="body2">o descritor mostra onde revisar.</text></g>
  <rect x="35" y="1245" width="1330" height="185" rx="24" class="section"/><text x="65" y="1295" class="label">4. CONTEXTOS TEMÁTICOS DE APOIO</text><text x="65" y="1335" class="h2">Situações reais para um aprendizado mais significativo.</text>
  <g><rect x="65" y="1365" width="180" height="34" rx="17" class="chip"/><text x="90" y="1387" class="chipText">apresentação pessoal</text><rect x="255" y="1365" width="170" height="34" rx="17" class="chip"/><text x="286" y="1387" class="chipText">viagens e horários</text><rect x="435" y="1365" width="180" height="34" rx="17" class="chip"/><text x="470" y="1387" class="chipText">cidade e localidade</text><rect x="625" y="1365" width="180" height="34" rx="17" class="chip"/><text x="659" y="1387" class="chipText">rotina e tempo livre</text><rect x="815" y="1365" width="220" height="34" rx="17" class="chip"/><text x="845" y="1387" class="chipText">trabalho e ambiente militar</text><rect x="1045" y="1365" width="255" height="34" rx="17" class="chip"/><text x="1078" y="1387" class="chipText">convites e interação social</text></g><text x="250" y="1417" class="note">Temas de apoio para dar realismo aos exercícios — não representam uma lista oficial da prova.</text>
  <rect x="35" y="1455" width="1330" height="255" rx="24" class="section"/><text x="65" y="1505" class="label">5. REGRA PEDAGÓGICA</text><text x="65" y="1545" class="h2">Como decidir a próxima ação</text><rect x="75" y="1570" width="1250" height="100" rx="20" class="panelStrong"/><text x="105" y="1610" class="body">Dificuldade em um descritor: retorne à Base e repita o mesmo tipo de habilidade.</text><text x="105" y="1640" class="body">Desempenho consistente no Alvo N2: use o Desafio para aumentar a margem de segurança.</text><text x="105" y="1670" class="body">Antes da prova: volte ao Alvo N2 e faça o Simulado sem feedback imediato.</text><text x="920" y="1795" class="note" style="fill:#74beff;font-weight:700;letter-spacing:2px">MESMO PROCESSO • MAIS CONFIANÇA • VOCÊ MAIS LONGE</text>
</svg>